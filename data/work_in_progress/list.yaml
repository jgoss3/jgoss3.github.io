- title: "Betting Across Borders: Consumer Credit Impacts from Mobile Sports Betting in the Presence of Spatial Spillovers"
  pdflink: "https://www.newyorkfed.org/research/staff_reports/sr1184.html"
  coauthors: "Daniel Mangrum"
  abstract: >
    Since the 2018 Murphy v. NCAA decision, 38 states have legalized mobile sports betting. We study effects on betting and consumer credit, emphasizing spatial spillovers across state lines. Using consumer spending data and an extended two-way fixed effects framework that separately identifies direct and spillover effects, we find that legalization increases total sportsbook spending roughly tenfold and take-up by 3.1 percentage points. Counties in non-legal states within 15 miles of a legal state experience spillover spending equal to roughly 14% of the direct effect, with these spillovers declining to roughly zero by 60 miles. Using the New York Fed Consumer Credit Panel, we find that median credit scores decline by roughly 1 point and overall delinquency rises 0.3 percentage points from a 10.7% base, with spillover delinquency rising nearly 0.2 percentage points. Under-40 auto loan delinquency increases by half a percentage point and credit card delinquency by one percentage point, driving the overall increase in delinquency. Scaling the population-level delinquency effect by take-up yields implied delinquency increases of roughly 10 percentage points among induced bettors. We conclude with a policy simulation which reveals that spillovers create a fiscal asymmetry: states that have not legalized bear costs from cross-border betting without capturing tax revenue, giving high-exposure states a stronger case for legalization. This incentive is increasing in states that have higher pre-legalization betting activity, population centers near legal states, and a younger population. Methodologically, we show that ignoring spatial spillovers can contribute to attenuated estimates and an under-count of the affected population.

- title: "Refinancing Student Debt: Borrower Preferences and Policy Implications"
  abstract: >
    This paper examines the effects of student loan refinancing on borrower repayment and financial health using a large administrative credit bureau panel and a modern difference-in-differences design. I develop a novel algorithm to identify refinancing events, since they are not directly observed in the data, and estimate effects across multiple treatment models and control groups to assess robustness to selection bias. Refinancing leads to a persistent decline in student loan delinquency of roughly 6 percent, driven by improved liquidity rather than accelerated repayment, as refinancers keep their paydown rate constant but receive higher credit card limits and miss fewer payments on other debts. I also find modest increases in mortgage participation, suggesting spillovers into the housing market. Because refinancing is available primarily to low-risk borrowers, its benefits accrue to a relatively advantaged group, with implications for the distribution of financial relief and the risk composition of the federal student loan portfolio.
