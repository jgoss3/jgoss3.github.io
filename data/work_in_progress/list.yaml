- title: "Refinancing Student Debt: Borrower Preferences and Policy Implications"
  abstract: >
    This paper examines the effects of student loan refinancing on borrower repayment and financial health using a large administrative credit bureau panel and a modern difference-in-differences design. I develop a novel algorithm to identify refinancing events, since they are not directly observed in the data, and estimate effects across multiple treatment models and control groups to assess robustness to selection bias. Refinancing leads to a persistent decline in student loan delinquency of roughly 6 percent, driven by improved liquidity rather than accelerated repayment, as refinancers keep their paydown rate constant but receive higher credit card limits and miss fewer payments on other debts. I also find modest increases in mortgage participation, suggesting spillovers into the housing market. Because refinancing is available primarily to low-risk borrowers, its benefits accrue to a relatively advantaged group, with implications for the distribution of financial relief and the risk composition of the federal student loan portfolio.
